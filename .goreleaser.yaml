version: 2

builds:
  - id: st
    main: ./cmd/st
    binary: st
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/andyrewlee/stacked/cmd.version={{.Version}}

archives:
  - id: st
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

# Release signing: minisign writes checksums.txt.minisig, a detached signature
# over checksums.txt — which transitively covers every artifact. install.sh
# fetches that .minisig and verifies it (minisign -V, fail-closed) before
# trusting any checksum, so a release must never publish unsigned.
#
# The secret key is a GitHub secret (MINISIGN_KEY, base64 of the key file)
# materialized by the release job in .github/workflows/ci.yml to a 0600 temp
# file whose path is exported as MINISIGN_KEY_FILE. It is never committed to
# the repo — see the signing runbook in CONTRIBUTING.md's Releasing section.
# Only `goreleaser release` reaches this pipe: `goreleaser build` doesn't run
# it, and snapshot rehearsals pass --skip=sign (scripts/check-install-assets.sh).
# With MINISIGN_KEY_FILE unset the template expansion itself fails the release
# before signing — unsigned artifacts cannot ship silently.
signs:
  - cmd: minisign
    signature: "${artifact}.minisig"
    args:
      - "-S"
      - "-W" # never prompt for a key password — the CI key is stored unencrypted
      - "-s"
      - "{{ .Env.MINISIGN_KEY_FILE }}"
      - "-x"
      - "${signature}"
      - "-m"
      - "${artifact}"
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: andyrewlee
    name: stacked
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
