version: 2

builds:
  - id: st
    main: ./cmd/st
    binary: st
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/andyrewlee/stacked/cmd.version={{.Version}}

archives:
  - id: st
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: andyrewlee
    name: stacked
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
