version: 2

builds:
  - id: st
    main: ./cmd/st
    binary: st
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/andyrewlee/stacked/cmd.version={{.Version}}

archives:
  - id: st
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

# Release signing: minisign writes checksums.txt.minisig, a detached signature
# over checksums.txt — which transitively covers every artifact. install.sh
# fetches that .minisig and verifies it (minisign -V, fail-closed) before
# trusting any checksum, so a release must never publish unsigned.
#
# The secret key lives OUTSIDE the repo (never committed): `make release`
# reads its path from MINISIGN_KEY_FILE, and the check-release-ready
# preflight fails first when it is unset or when install.sh still carries a
# placeholder public key — see the signing runbook in CONTRIBUTING.md's
# Releasing section.
# Only `goreleaser release` reaches this pipe: `goreleaser build` doesn't run
# it, and snapshot rehearsals pass --skip=sign (scripts/check-install-assets.sh).
# With MINISIGN_KEY_FILE unset the template expansion itself fails the release
# before signing — unsigned artifacts cannot ship silently.
signs:
  - cmd: minisign
    signature: "${artifact}.minisig"
    args:
      - "-S"
      - "-W" # never prompt for a key password — the release key is stored unencrypted
      - "-s"
      - "{{ .Env.MINISIGN_KEY_FILE }}"
      - "-x"
      - "${signature}"
      - "-m"
      - "${artifact}"
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: andyrewlee
    name: stacked
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
