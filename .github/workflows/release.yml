name: Release

# Tag-driven releases, mirroring the amux pipeline (minus artifact signing,
# which needs a provisioned keypair — add it alongside amux's when that
# happens): push a v* tag and GoReleaser publishes the GitHub Release with
# darwin/linux amd64+arm64 tarballs and checksums.txt.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# One release run per tag; a re-pushed tag queues rather than racing the
# in-flight publish (deliberately NOT cancel-in-progress: killing a
# half-published release is worse than waiting).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Kill a hung publish well before the 6h default; a healthy run takes minutes.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history so GoReleaser can derive the changelog since the
          # previous tag.
          fetch-depth: 0
          # Nothing here pushes as the checkout credential: GoReleaser
          # publishes via secrets.GITHUB_TOKEN, not git-over-HTTPS.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Tag matches compiled-in defaultVersion
        run: make check-release-version RELEASE_TAG="${GITHUB_REF_NAME}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned like golangci-lint (Makefile GOLANGCI_VERSION); bump deliberately.
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
