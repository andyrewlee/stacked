name: CI

on:
  push:
    # Feature-branch pushes get their CI from the pull_request trigger; running
    # push CI too double-fired the whole matrix for every push to an open PR
    # (the concurrency group includes the event name, so the two runs never
    # cancel each other). Keep push CI where there is no PR run: main and tags.
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# The single Go pin: both jobs' setup-go steps and build-cache keys expand
# from this value, so a version bump is a one-line edit.
env:
  GO_VERSION: '1.26'

# A re-push supersedes the previous run of the same ref; don't keep burning
# two runners on it. github.ref alone would collide all PRs on the merge ref,
# so include the event name and PR number.
# Exception: v-tag pushes queue instead of cancelling. The release job lives
# in this workflow, and killing an in-flight tag run could orphan a
# half-published release (the release job's own concurrency group also
# serializes publishes per tag).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Kill a hung leg well before the 6h default; a healthy run takes minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # full history so `git describe` can produce a version

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # stdlib-only: go.mod is static, so setup-go's cache key never re-saves

      - name: Resolve Go build cache dir
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      # Keyed on the commit so every run saves; restored by prefix so the newest
      # previous cache seeds the next run, including this repo's package builds.
      - name: Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-go${{ env.GO_VERSION }}-

      # Dev tooling is installed as an external binary only; it is never added to
      # go.mod (the shipped tool stays standard-library only). golangci-lint v2
      # is required because .golangci.yml uses the v2 schema; its gofumpt
      # formatter is compiled in, so no separate gofumpt install is needed.
      - name: Install golangci-lint (binary)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Keep in sync with GOLANGCI_VERSION in the Makefile (this field cannot
          # read a Make variable).
          version: v2.12.2
          install-mode: binary
          # The Makefile drives the lint step itself; this action only installs.
          args: --help

      # `make ci` is the single source of truth: fmt-check + strict lint + vet +
      # build + race tests + black-box e2e + coverage gate. Local and CI run the
      # exact same command.
      # Catch a broken .goreleaser.yaml on the PR that breaks it, not on the
      # next v* tag. install-only skips any release/build work.
      - name: Install GoReleaser (binary only)
        if: matrix.os == 'ubuntu-latest'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          install-only: true
      - name: Validate .goreleaser.yaml
        if: matrix.os == 'ubuntu-latest'
        run: goreleaser check

      # install.sh reconstructs release asset names client-side
      # (stacked_<ver>_<os>_<arch>.tar.gz + checksums.txt); a .goreleaser.yaml
      # name_template change must not silently break every curl-install. The
      # script builds a snapshot and verifies names, checksums, and a file://
      # install — run it on the leg that already installed goreleaser.
      - name: Check installer syntax
        if: matrix.os == 'ubuntu-latest'
        run: sh -n install.sh
      - name: Installer matches goreleaser artifacts
        if: matrix.os == 'ubuntu-latest'
        run: scripts/check-install-assets.sh

      # The signature/checksum decision matrix exercises install.sh's
      # fail-closed paths against a disposable signed fixture — it needs a real
      # minisign but never a release secret (keys are generated per run).
      - name: Install minisign
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: Installer signature decision matrix
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/check-install-signatures.sh

      - name: make ci
        run: make ci

  ci-windows:
    name: ci (windows, tests only)
    runs-on: windows-latest
    # Kill a hung leg well before the 6h default; a healthy run takes minutes.
    timeout-minutes: 20
    steps:
      - name: Disable checkout CRLF conversion
        run: git config --global core.autocrlf false

      # No fetch-depth: nothing here runs `git describe` or reads history
      # (check-release-version is release-only).
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # stdlib-only: go.mod is static, so setup-go's cache key never re-saves

      - name: Resolve Go build cache dir
        id: gocache
        shell: bash
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-go${{ env.GO_VERSION }}-

      # The lint/fmt/coverage gates are platform-independent and owned by the
      # ubuntu/macos `make ci` legs. This job exists to execute the
      # windows-only code (lock_other.go, lock_owner_windows.go) that
      # vet-cross only compiles; the ./internal/... run below covers the
      # engine (windows lock path) too.
      - name: Vet
        run: go vet ./...

      # The two windows-specific e2e incompatibilities found on the first
      # Windows run (unsafe-symlink rollback behavior; the OS rewriting raw C1
      # bytes) are now runtime.GOOS skips inside the tests themselves —
      # TestWorktreeIncludeCopyFailureRollsBackWorktree and
      # TestLogEscapesControlBytesInSubject — so the black-box suite runs here
      # too. If a future windows run surfaces another incompatibility, guard it
      # with the same skip pattern rather than re-excluding the package.
      - name: Non-e2e package tests
        run: go test ./cmd/... ./internal/... -race -count=1

      - name: e2e tests (black-box binary)
        run: go test ./e2e/... -count=1

  # Publishing waits on ALL ci legs — the ubuntu+macos matrix and the windows
  # tests — so a broken commit can never ship release artifacts to install.sh
  # users. The workflow's push.tags 'v*' trigger is what fires this job; the
  # `if` keeps it skipped on branch pushes and PRs. `contents: write` is
  # scoped to this job alone; the ci legs keep workflow-level `contents: read`.
  release:
    name: Release
    needs: [ci, ci-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Kill a hung publish well before the 6h default; a healthy run takes minutes.
    timeout-minutes: 15
    # One publish per tag; a re-pushed tag queues rather than racing the
    # in-flight publish (deliberately NOT cancel-in-progress: killing a
    # half-published release is worse than waiting).
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history so GoReleaser can derive the changelog since the
          # previous tag.
          fetch-depth: 0
          # Nothing here pushes as the checkout credential: GoReleaser
          # publishes via secrets.GITHUB_TOKEN, not git-over-HTTPS.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Tag matches compiled-in defaultVersion
        run: make check-release-version RELEASE_TAG="${GITHUB_REF_NAME}"

      # minisign signs checksums.txt (the `signs:` pipe in .goreleaser.yaml);
      # install.sh verifies checksums.txt.minisig fail-closed. The package
      # lives in Ubuntu universe — present on ubuntu-latest (24.04+), absent on
      # jammy; if a future ubuntu-latest drops it, fetch the upstream binary
      # with a pinned SHA256 instead.
      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      # MINISIGN_KEY is the base64-encoded minisign secret key file
      # (provisioning: CONTRIBUTING.md's Releasing section). It is decoded to a
      # 0600 temp file that .goreleaser.yaml's signs pipe reads via
      # {{ .Env.MINISIGN_KEY_FILE }}. Missing secret = hard failure, on purpose:
      # an unsigned release would break every curl-install (install.sh verifies
      # the .minisig fail-closed), so the publish must not proceed.
      - name: Materialize minisign secret key
        env:
          MINISIGN_KEY_B64: ${{ secrets.MINISIGN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_KEY_B64}" ]; then
            echo "::error::MINISIGN_KEY secret is not set — provision the release signing keypair first (CONTRIBUTING.md, Releasing section)"
            exit 1
          fi
          umask 077
          key="$(mktemp "${RUNNER_TEMP}/minisign-key.XXXXXX")"
          printf '%s' "${MINISIGN_KEY_B64}" | base64 -d > "${key}"
          if ! grep -q 'secret key' "${key}"; then
            echo "::error::MINISIGN_KEY decoded but does not look like a minisign secret key file"
            rm -f "${key}"
            exit 1
          fi
          chmod 600 "${key}"
          echo "MINISIGN_KEY_FILE=${key}" >> "${GITHUB_ENV}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned like golangci-lint (Makefile GOLANGCI_VERSION); bump deliberately.
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Defense in depth: the key lives under RUNNER_TEMP (outside the checkout,
      # wiped with the job), but remove it explicitly even on failure.
      - name: Remove minisign secret key
        if: always()
        run: '[ -n "${MINISIGN_KEY_FILE:-}" ] && rm -f "${MINISIGN_KEY_FILE}" || true'
